<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>주현석 자기소개 홈페이지</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <header class="header">
      <h1>주현석 자기소개</h1>
      <p class="subtitle">나만의 간단 포트폴리오</p>
    </header>

    <main class="container">
      <section class="profile-card">
        <div class="profile-left">
          <div class="avatar"><span>HS</span></div>
        </div>
        <div class="profile-right">
          <h2>주현석</h2>
          <p class="profile-role">메카트로닉스공학 전공 대학생</p>
          <p class="summary">안녕하세요, 20살 주현석입니다.</p>
          
          <div class="info-grid">
            <div class="info-item">
              <span class="info-label">나이</span>
              <span class="info-value">20살</span>
            </div>
            <div class="info-item">
              <span class="info-label">전공</span>
              <span class="info-value">메카드로닉스공학 전공</span>
            </div>
            <div class="info-item">
              <span class="info-label">특기</span>
              <span class="info-value">로봇 제어</span>
            </div>
            <div class="info-item">
              <span class="info-label">취미</span>
              <span class="info-value">독서, 기타 연주</span>
            </div>
          </div>
        </div>
      </section>

      <section class="section-card">
        <h3>About Me</h3>
        <p>저는 문제를 해결하는 과정을 좋아합니다. 기계와 전자가 결합된 메카트로닉스 공학을 통해 실질적인 솔루션을 만드는 것에 큰 흥미를 느끼고 있습니다.</p>
      </section>

      <section class="section-card">
        <h3>관심 분야</h3>
        <ul class="tag-list">
          <li class="tag">로봇</li>
          <li class="tag">로켓 제작</li>
          <li class="tag">캐드</li>
        </ul>
      </section>

      <footer class="footer">
        <p>© 2026 Joo Hyun Seok</p>
      </footer>
    </main>
  </div>
</body>
</html>
